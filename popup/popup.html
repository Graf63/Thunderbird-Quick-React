<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      padding: 12px;
      margin: 0;
      background: #fff;
      font-family: -apple-system, sans-serif;
    }

    #replyAllContainer {
      display: none;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #E2E5EF;
      text-align: center;
      font-size: 13px;
      color: #1A1B2E;
    }

    #replyAllContainer label {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    #container {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-size: 24px;
      cursor: pointer;
      border: none;
      background: none;
      transition: transform 0.1s;
    }

    button:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>
  <div id="replyAllContainer">
    <label><input type="checkbox" id="replyAllCb"> <span data-i18n="replyAll">Répondre à tous</span></label>
  </div>
  <div id="container"></div>
  <script src="popup.js"></script>
</body>

</html>
